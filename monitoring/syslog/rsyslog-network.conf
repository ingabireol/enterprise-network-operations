# ---------------------------------------------------------------------------
# rsyslog configuration for the network syslog collector.
#
# Devices send over TCP on 601 (RFC 6587 framing) rather than UDP 514, for one
# reason: UDP syslog silently drops under load, and the load spikes exactly when
# something is going wrong. Losing the log of an event because of the event is
# the worst possible failure mode for a logging system.
# ---------------------------------------------------------------------------

module(load="imtcp" MaxSessions="500")
input(type="imtcp" port="601" ruleset="network-devices")

module(load="imudp")
input(type="imudp" port="514" ruleset="network-devices")   # legacy devices only

# Templates -----------------------------------------------------------------
template(name="NetworkDeviceFile" type="string"
         string="/var/log/network/%HOSTNAME%/%$YEAR%-%$MONTH%-%$DAY%.log")

template(name="NetworkDeviceFormat" type="string"
         string="%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogseverity-text% %syslogfacility-text% %msg%\n")

ruleset(name="network-devices") {

    # --- Severity 0-2: emergency, alert, critical ---------------------------
    # These go to their own file and to the alerting pipeline. On a Cisco device
    # a critical-severity message is almost always something that has just
    # changed state in a way somebody needs to know about.
    if ($syslogseverity <= 2) then {
        action(type="omfile" file="/var/log/network/critical.log"
               template="NetworkDeviceFormat")
        action(type="omfwd" target="alertmanager-webhook" port="9095"
               protocol="tcp" template="NetworkDeviceFormat"
               action.resumeRetryCount="10"
               queue.type="linkedList" queue.size="10000")
    }

    # --- Configuration changes ----------------------------------------------
    # %SYS-5-CONFIG_I is the record of a human changing something. It is routed
    # separately because it is the first thing anyone looks for after an
    # unexplained change.
    if ($msg contains "CONFIG_I") or ($msg contains "CONFIG_NOTIFY") then {
        action(type="omfile" file="/var/log/network/config-changes.log"
               template="NetworkDeviceFormat")
    }

    # --- Authentication -----------------------------------------------------
    if ($msg contains "LOGIN_FAILED")
       or ($msg contains "AUTHFAIL")
       or ($msg contains "%SEC_LOGIN")
       or ($msg contains "SSH2_SESSION") then {
        action(type="omfile" file="/var/log/network/authentication.log"
               template="NetworkDeviceFormat")
    }

    # --- Link state ---------------------------------------------------------
    # High volume and individually low value, but the pattern over time is how
    # a flapping link is found.
    if ($msg contains "LINEPROTO-5-UPDOWN") or ($msg contains "LINK-3-UPDOWN") then {
        action(type="omfile" file="/var/log/network/link-state.log"
               template="NetworkDeviceFormat")
    }

    # --- Routing ------------------------------------------------------------
    if ($msg contains "BGP-5-ADJCHANGE")
       or ($msg contains "OSPF-5-ADJCHG")
       or ($msg contains "HSRP-5-STATECHANGE") then {
        action(type="omfile" file="/var/log/network/routing.log"
               template="NetworkDeviceFormat")
    }

    # --- Everything, per device ---------------------------------------------
    action(type="omfile" dynaFile="NetworkDeviceFile"
           template="NetworkDeviceFormat"
           dirCreateMode="0750" fileCreateMode="0640")

    stop
}

# Retention ------------------------------------------------------------------
# 90 days locally; the shipping pipeline below keeps the searchable copy.
$WorkDirectory /var/spool/rsyslog
$ActionQueueType LinkedList
$ActionQueueFileName networkq
$ActionQueueMaxDiskSpace 4g
$ActionQueueSaveOnShutdown on
$ActionResumeRetryCount -1
