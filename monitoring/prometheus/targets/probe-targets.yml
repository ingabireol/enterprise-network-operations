# Reachability probes. The inter-site targets are the ones that matter most:
# they are what tells you the WAN is degraded before users do.
- targets: ['10.30.1.11', '10.30.1.21', '10.30.1.41', '10.30.1.51']
  labels: { site: dc-primary, probe_type: device }

- targets: ['10.40.1.11', '10.40.1.21', '10.40.1.41', '10.40.1.51']
  labels: { site: dc-secondary, probe_type: device, path: inter-site }

- targets: ['10.30.20.11', '10.30.30.11']
  labels: { site: dc-primary, probe_type: platform_host }

- targets: ['10.40.30.11']
  labels: { site: dc-secondary, probe_type: platform_host, path: inter-site }
